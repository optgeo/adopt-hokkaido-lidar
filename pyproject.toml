[project]
name = "adopt-hokkaido-lidar"
version = "0.1.0"
description = "Discover Hokkaido aerial LiDAR ORIGINAL LAZ packages, convert to per-file COPC, and publish with provenance-first policy."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adopt_hokkaido_lidar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
